name: Apply product PUT fix

on:
  push:
    branches:
      - hotfix/solve_problem_put
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch static/script.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('static/script.js')
          text = path.read_text()
          old = """                    const todosCached = await getProductosCached();
                    const prod = todosCached.find(x => String(x.ID) === String(id));
                    if (!prod) { showToast('Producto no encontrado', 'error'); span.textContent = originalText; return; }
                    prod[field] = parsed;
"""
          new = """                    // Obtener el producto completo. /productos?lite=true omite campos
                    // como lote, fechas, INVIMA y observación, y PUT los borraría.
                    const prodResp = await fetch(`/productos/${id}`);
                    if (!prodResp.ok) {
                        const e = await prodResp.json().catch(() => ({}));
                        throw new Error(e.error || 'No se pudo obtener el producto');
                    }
                    const prod = await prodResp.json();
                    if (!prod) { showToast('Producto no encontrado', 'error'); span.textContent = originalText; return; }
                    prod[field] = parsed;
"""
          if old not in text:
              raise SystemExit('No se encontró el bloque de edición esperado en static/script.js')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit script change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/script.js
          git commit -m 'fix: preserve product fields on PUT edit'
          git rm .github/workflows/apply-put-fix.yml
          git commit -m 'chore: remove temporary PUT fix workflow'
          git push