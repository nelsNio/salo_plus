<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Inventario - Droguería</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <img src="/images/logo.jpg" alt="Logo" class="app-logo">
        <div class="app-title">
            <div class="name">Droguería Salo Plus</div>
            <div class="nit">NIT 1.049.647.310-5</div>
        </div>
    </header>
    <h1>Inventario</h1>
    <a href="/admin_ventas">Ir a Ventas</a>
    <a href="/historial_ventas">Ver Historial de Ventas</a>
    
    <h3>Agregar producto</h3>
<form id="formProducto">
    <label for="fecha_ingreso">Fecha Ingreso:</label>
    <input id="fecha_ingreso" type="date" name="fecha_ingreso" placeholder="Fecha ingreso" required>
    <input name="nombre" placeholder="Nombre y concentración" required>
    <input name="laboratorio" placeholder="Laboratorio">
    <input name="presentacion" placeholder="Presentación">
    <label for="precio_unitario">Precio Unitario:</label>
    <input id="precio_unitario" name="precio_unitario" type="number" step="0.01" min="0" placeholder="Precio unitario" required>
    <input type="number" name="cantidad" placeholder="Cantidad">
    <input name="lote" placeholder="Lote">
    <input name="codigo_barras" placeholder="Código de barras">
    <input name="registro_invima" placeholder="Registro INVIMA">
    <label for="fecha_venc">Fecha Vencimiento:</label>
    <input id="fecha_venc" type="date" name="fecha_venc" placeholder="Fecha vencimiento">
    <input name="observacion" placeholder="Observación">
    <button type="submit">Guardar</button>
</form>
<h3>Buscar</h3>
<input id="busqueda" placeholder="Buscar por nombre, lote o INVIMA">

    <h2>Lista de Productos</h2>
   <table>
  <thead>
  <tr>
 <th>Fecha ingreso</th><th>Nombre</th><th>Lab</th><th>Presentación</th><th>Precio</th>
 <th>Cant</th><th>Lote</th><th>Código de barras</th><th>Registro INVIMA</th><th>Vencimiento</th><th>Obs</th>
  </tr>
  </thead>
<tbody id="tablaProductos"></tbody>
</table>

<div id="paginacionProductos" style="margin-top:8px; display:flex; align-items:center; gap:8px;">
  <button id="prevProdPage" type="button">Anterior</button>
  <span id="prodPageInfo">Página 1/1</span>
  <button id="nextProdPage" type="button">Siguiente</button>
  <label for="prodPageSize" style="margin-left:12px;">Por página:</label>
  <select id="prodPageSize">
    <option value="10">10</option>
    <option value="20" selected>20</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
  <span id="prodTotalInfo" style="margin-left:12px;color:#666"></span>
  
</div>



<script src="/static/script.js"></script>
</body>
</html>
