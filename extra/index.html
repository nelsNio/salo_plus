<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inventario Droguería</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
table, th, td { border: 1px solid #ccc; }
th, td { padding: 8px; text-align: left; }
input, button { padding: 6px; margin: 4px; }
</style>
</head>
<body>
<h1>Inventario Droguería</h1>

<h3>Agregar producto</h3>
<form id="formProducto">
    <input name="fecha_ingreso" placeholder="Fecha ingreso" required>
    <input name="nombre" placeholder="Nombre y concentración" required>
    <input name="laboratorio" placeholder="Laboratorio">
    <input name="presentacion" placeholder="Presentación">
    <input type="number" name="cantidad" placeholder="Cantidad">
    <input name="lote" placeholder="Lote">
    <input name="registro_invima" placeholder="Registro INVIMA">
    <input name="fecha_venc" placeholder="Fecha vencimiento">
    <input name="observacion" placeholder="Observación">
    <button type="submit">Guardar</button>
</form>

<h3>Buscar</h3>
<input id="busqueda" placeholder="Buscar por nombre, lote o INVIMA">

<h3>Registrar venta</h3>
<form id="formVenta">
    <input id="buscarProductoVenta" placeholder="Buscar producto..." required>
    <select id="productoSeleccionado" name="producto_id" required>
        <option value="">Seleccione un producto</option>
    </select>
    <input name="cantidad" placeholder="Cantidad" type="number" required>
    <input name="precio_unitario" placeholder="Precio unitario" type="number" step="0.01" required>
    <input name="fecha" placeholder="Fecha" required>
    <button type="submit">Vender</button>
</form>
<h3>Historial de ventas</h3>
<div>
    <strong>Total vendido hoy:</strong> $<span id="totalHoy">0</span><br>
    <strong>Total vendido en general:</strong> $<span id="totalGeneral">0</span>
</div>

<table>
    <thead>
    <tr>
        <th>Fecha</th><th>Producto</th><th>Cant</th><th>Precio unitario</th><th>Total</th>
    </tr>
    </thead>
    <tbody id="tablaVentas"></tbody>
</table>


<table>
<thead>
<tr>
<th>Fecha ingreso</th><th>Nombre</th><th>Lab</th><th>Presentación</th>
<th>Cant</th><th>Lote</th><th>Registro INVIMA</th><th>Vencimiento</th><th>Obs</th>
</tr>
</thead>
<tbody id="tablaProductos"></tbody>
</table>

<script>

</script>
</body>
</html>
